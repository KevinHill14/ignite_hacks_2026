# Render blueprint: https://render.com/docs/blueprint-spec
#
# Two services. The web app is public; n8n is private and holds every
# credential. They talk over Render's internal network, so the pipeline
# webhook is never exposed to the internet.

services:
  # --------------------------------------------------------------- web app --
  - type: web
    name: syllabus-web
    runtime: node
    plan: starter
    rootDir: web
    # --include=dev is required, not optional. NODE_ENV=production below makes
    # npm skip devDependencies, but the BUILD needs them — Tailwind, PostCSS
    # and TypeScript all live there. Without it the build dies on
    # "Cannot find module '@tailwindcss/postcss'". NODE_ENV still applies at
    # runtime, which is where it actually belongs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Internal address — resolves only inside Render's private network.
      - key: N8N_WEBHOOK_URL
        value: http://syllabus-n8n:5678/webhook/syllabus-ingest
      # Shared secret. Generated once by Render, then copied into the n8n
      # header-auth credential by hand (n8n stores it encrypted).
      - key: INGEST_TOKEN
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "10"
      # The password handed to judges. Set it in the dashboard, not here.
      # Blank means no gate at all, which is fine locally and wrong in public.
      - key: APP_PASSWORD
        sync: false
      # Six a minute, because a full course load is five files uploaded at
      # once — one user action producing five requests.
      - key: RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: RATE_LIMIT_PER_DAY
        value: "25"

  # ------------------------------------------------------------------ n8n --
  - type: pserv # private service: no public URL, no inbound internet traffic
    name: syllabus-n8n
    runtime: image
    plan: starter
    image:
      # Docker Hub, not n8n's own registry mirror (docker.n8n.io) — Render
      # cannot fetch from that host. Same image, different front door.
      url: docker.io/n8nio/n8n:latest
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      # 1 GB is the minimum and still ~600x what this needs: the n8n SQLite
      # database is about 1.5 MB, holding a handful of credentials and one
      # workflow. Execution data is pruned after 72 hours and not kept on
      # success at all, so it does not grow.
      #
      # Worth getting right before the first deploy — Render disks can be
      # expanded later but never shrunk, so over-provisioning here is a
      # permanent line on the bill.
      sizeGB: 1
    envVars:
      # Encrypts the Google and Anthropic credentials at rest on the disk.
      # Generated once and never rotated — rotating it orphans every stored
      # credential.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_PORT
        value: "5678"
      - key: GENERIC_TIMEZONE
        value: America/Toronto
      - key: TZ
        value: America/Toronto
      # The workflow reads both of these at run time via $env. Without them
      # the expressions fall back to their defaults, which silently means the
      # wrong model and the connected account's PRIMARY calendar.
      - key: EXTRACTION_MODEL
        value: claude-sonnet-5
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # NOT OPTIONAL. n8n blocks $env unless this is the literal string
      # "false" — unset means blocked. Without it the Calendar node's
      # $env.GOOGLE_CALENDAR_ID throws "access to env vars denied" and every
      # event fails, while EXTRACTION_MODEL silently falls back to the wrong
      # model. Both failures are silent. This cost hours locally.
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      # Hardening, mirroring n8n/docker-compose.yml.
      - key: NODE_FUNCTION_ALLOW_EXTERNAL
        value: ""
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_TEMPLATES_ENABLED
        value: "false"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "72"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "none"
      - key: N8N_PAYLOAD_SIZE_MAX
        value: "24"
      # WEBHOOK_URL is deliberately NOT set here. It only affects the URLs n8n
      # advertises for its own webhooks, and nothing depends on those: the web
      # app reaches n8n by internal service name, and the Drive trigger ships
      # disabled. Marking it `sync: false` made Render demand a value that
      # cannot exist until the service has a URL, which fails the sync.
      #
      # If you later enable Google OAuth or the Drive trigger, add it by hand
      # in the dashboard once you know the host.
